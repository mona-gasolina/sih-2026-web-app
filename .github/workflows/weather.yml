# Hourly forecast download for the hosted site (see relay_weather.py).
# GitHub's servers download from Open-Meteo and publish weather.json on the
# weather-data branch; the Render server reads it from there. The branch keeps
# only the latest file (one commit, replaced each hour), and main is never
# touched, so Render does not redeploy.
name: Hourly weather

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (GitHub may start it a little late)
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the forecast
        run: python relay_weather.py out/weather.json
      - name: Publish on the weather-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b weather-data
          git config user.name "github-actions[bot]"
          git config user.email "41898769+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git commit -q -m "Weather $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" weather-data
